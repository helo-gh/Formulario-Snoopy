<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <title>Formulario Snoopy</title>
</head>
<body>
    <main class="container">
<form>
    <h1>Login com Snoopy</h1>
    <div class="input-box">
        <input type="text"
        placeholder="Usuário">
        <i class="bx bxs-user">
        </i>
    </div>
    
    <div class="input-box">
        <input type="password"
        placeholder="Senha">
        <i class="bx bxs-lock-alt"><!--Ícones e sgnifi-->
        </i>
    </div>
    <div class="remember-forgot">
        <label>
            <input type=checkbox> Lembrar senha
        </label>
        <a href="#" >Esqueci senha</a>
    </div>
    <button type="submit" class="Login"> Login</button>
    <div class="register-link"><p>Não tem uma conta?<a href="#">Cadastre-se</a> </p></div>
</form>
    </main>
</body>
</html>
